<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말모이 언어학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 줄짜리 앱 화면(최대 560px) — 언어 고르기 → 단원 길 → 문제 카드 + 아래 고정 버튼 */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#18213A; --muted:#5D6B86; --line:#D5DDEA;
  --accent:#2F5BEA; --accent-deep:#1E3DAA; --on-accent:#FFFFFF;
  --gold:#F2A900; --gold-deep:#B97C00;
  --good:#1F9D55; --good-bg:#DDF5E6; --bad:#D93A45; --bad-bg:#FBE1E3;
  --locked:#C3CCDA; --locked-deep:#9AA6BA;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1524; --surface:#18203A; --ink:#E8EDF7; --muted:#9AA8C4; --line:#2A3555;
    --accent:#7090FF; --accent-deep:#3F5CCB; --on-accent:#0B1020;
    --gold:#FFC23D; --gold-deep:#B9860F;
    --good:#43D184; --good-bg:#12351F; --bad:#FF6B75; --bad-bg:#3A1519;
    --locked:#34405E; --locked-deep:#242D45;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) 140px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}

/* 상단 상태줄 */
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:var(--display);font-size:26px;color:var(--accent)}
.stats{display:flex;gap:14px;font-weight:700;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:5px}
.stat svg{width:20px;height:20px}
.stat.fire{color:var(--gold-deep)} .stat.xp{color:var(--accent)} .stat.heart{color:var(--bad)}
@media (prefers-color-scheme: dark){ .stat.fire{color:var(--gold)} }

/* 홈 */
.hero{margin-top:22px;display:grid;gap:6px}
.hero h1{font-size:30px}
.hero p{margin:0;color:var(--muted)}
.notice{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:14px}
.notice b{color:var(--ink)}
.continue{margin-top:14px;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--accent);color:var(--on-accent);border:0;border-bottom:4px solid var(--accent-deep);width:100%;text-align:left}
.continue .big{font-family:var(--display);font-size:20px}
.continue small{display:block;opacity:.85}
.continue .go{margin-left:auto;font-family:var(--display);font-size:22px}
.search{margin-top:18px;width:100%;padding:12px 14px;font:inherit;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lang{display:grid;gap:2px;text-align:left;padding:12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;min-width:0}
.lang .nm{font-weight:700;overflow-wrap:anywhere}
.lang .hi{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang .bar{height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
.lang .bar i{display:block;height:100%;background:var(--gold)}
.lang.soon{opacity:.6;border-bottom-width:2px}
.lang.soon .hi{font-style:normal}
.lang:not(.soon):hover{border-color:var(--accent)}
.empty{color:var(--muted);padding:20px 0}

/* 코스 */
.back{border:0;background:none;font-family:var(--display);font-size:18px;color:var(--muted);padding:6px 0}
.course-head{margin-top:8px;display:grid;gap:4px}
.course-head h2{font-size:30px}
.course-head p{margin:0;color:var(--muted)}
.path{margin:26px 0 10px;display:grid;gap:22px;justify-items:center}
.node{display:grid;justify-items:center;gap:6px}
.node button{width:76px;height:70px;border-radius:50%;border:0;font-family:var(--display);font-size:26px;color:var(--on-accent);background:var(--accent);box-shadow:0 6px 0 var(--accent-deep);transition:transform .1s}
.node button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-deep)}
.node.done button{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep);color:#3A2600}
.node.locked button{background:var(--locked);box-shadow:0 6px 0 var(--locked-deep);color:var(--muted)}
.node.current button{animation:bob 1.6s ease-in-out infinite}
.node .lbl{font-weight:700;text-align:center;line-height:1.3}
.node .lbl small{display:block;font-weight:400;color:var(--muted)}
@keyframes bob{50%{transform:translateY(-5px)}}
.words{margin-top:28px;background:var(--surface);border-radius:18px;border:2px solid var(--line);overflow:hidden}
.words h3{font-size:20px;padding:14px 16px 6px}
.wrow{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.wrow .ko{color:var(--muted);font-size:14px}
.wrow .fw{font-weight:700;min-width:0;overflow-wrap:anywhere}
.wrow .fw small{display:block;font-weight:400;color:var(--muted)}
.spk{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.spk svg{width:20px;height:20px}

/* 레슨 */
.lhead{display:flex;align-items:center;gap:12px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:4px}
.progress{flex:1;height:16px;border-radius:10px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--good);border-radius:10px;transition:width .35s}
.qtitle{margin-top:26px;font-size:24px}
.prompt{margin-top:18px;display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.prompt .word{font-size:28px;font-weight:700;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.prompt .word small{display:block;font-size:15px;font-weight:400;color:var(--muted)}
.prompt .spk{width:52px;height:52px;flex:none;background:var(--accent);border-color:var(--accent-deep);color:var(--on-accent)}
.opts{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;padding:16px 12px 14px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);text-align:center;font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.opt small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.opt .k{position:absolute;top:6px;left:9px;font-size:11px;color:var(--muted);font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.match{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt.gone{opacity:.35;pointer-events:none;border-bottom-width:2px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot.ok{background:var(--good-bg);border-color:transparent}
.foot.no{background:var(--bad-bg);border-color:transparent}
.foot-in{max-width:560px;margin:0 auto;display:grid;gap:10px}
.fb{font-family:var(--display);font-size:22px}
.foot.ok .fb{color:var(--good)} .foot.no .fb{color:var(--bad)}
.fb small{display:block;font-family:var(--body);font-size:15px;color:var(--ink)}
.btn{width:100%;padding:14px;border-radius:16px;border:0;font-family:var(--display);font-size:20px;letter-spacing:.03em;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-deep);cursor:default}
.foot.ok .btn{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.foot.no .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}

/* 결과 */
.result{margin-top:12vh;display:grid;gap:18px;text-align:center;justify-items:center}
.result h2{font-size:34px}
.result p{margin:0;color:var(--muted)}
.medal{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:46px;background:var(--gold);color:#3A2600;box-shadow:0 8px 0 var(--gold-deep)}
.medal.fail{background:var(--bad-bg);color:var(--bad);box-shadow:0 8px 0 var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.tile b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);letter-spacing:.04em}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(92vw,460px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;z-index:20}
/* 재미 요소 */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.stat.lv{color:var(--good)}
.mas{width:56px;height:56px;flex:none}
.mas.big{width:96px;height:96px}
.mas svg{width:100%;height:100%;display:block}
.mas.hop{animation:hop .5s}
.mas.shake{animation:shake .35s}
@keyframes hop{30%{transform:translateY(-12px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.hero-row{display:flex;align-items:center;gap:14px}
.hero-row .mas{animation:bob 2.4s ease-in-out infinite}
.daily{margin-top:6px;border:0;background:none;padding:0;color:var(--muted);text-align:left;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.daily b{color:var(--ink);font-size:16px}
.daily span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.goal{margin-top:16px;display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.ring{width:56px;height:56px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s}
.goal-t{display:grid;gap:2px;min-width:0}
.goal-t b{font-family:var(--display);font-weight:400;font-size:18px}
.goal-t span{font-size:13px;color:var(--muted)}
.lvbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:block}
.lvbar i{display:block;height:100%;background:var(--good)}
.passport{margin-top:18px}
.passport h3{font-size:20px}
.stamps{display:flex;gap:14px;overflow-x:auto;padding:12px 4px 8px}
.stamp{flex:none;width:96px;height:96px;border-radius:50%;border:4px double var(--bad);color:var(--bad);display:grid;place-content:center;text-align:center;gap:1px;transform:rotate(var(--r,-6deg));font-size:11px;line-height:1.2;padding:8px}
.stamp .st-name{font-family:var(--display);font-size:14px}
.stamp .st-word{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px}
.stamp.new{width:124px;height:124px;font-size:13px;animation:thump .5s}
@keyframes thump{0%{transform:scale(2.2) rotate(-14deg);opacity:0}70%{transform:scale(.95) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.empty-s{color:var(--muted);font-size:14px;margin:0}
.blitz{margin-top:6px;width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:2px solid var(--gold-deep);border-bottom-width:4px;background:color-mix(in srgb,var(--gold) 18%,var(--surface));text-align:left}
.blitz svg{width:30px;height:30px;color:var(--gold-deep);flex:none}
.blitz b{font-family:var(--display);font-weight:400;font-size:19px;display:block}
.blitz small{color:var(--muted)}
.blitz .go{margin-left:auto;font-family:var(--display);font-size:22px}
.coach{display:flex;align-items:center;gap:12px;margin-top:22px}
.coach .qtitle{margin-top:0;padding:10px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:20px}
.combo{font-family:var(--display);color:var(--gold-deep);font-size:16px;white-space:nowrap}
.combo.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.5)}}
.combo-msg{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--gold);color:#3A2600;font-family:var(--body);font-size:13px;font-weight:700}
.stat.time{color:var(--accent)}
.stat.time.low{color:var(--bad);animation:pop .5s infinite}
.result .lvup{font-family:var(--display);font-size:22px;color:var(--good)}
@media (prefers-color-scheme: dark){ .combo,.blitz svg{color:var(--gold)} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">말모이</div>
    <div class="stats">
      <span class="stat fire" title="연속 학습일"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-1-3 3 1 5 4 5 7a7 7 0 0 1-14 0c0-6 6-8 7-13z"/></svg><b id="streak">0</b></span>
      <span class="stat xp" title="경험치"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><b id="xp">0</b></span>
      <span class="stat lv" id="lv" title="레벨">Lv.1</span>
    </div>
  </header>

  <!-- 홈 -->
  <main id="home">
    <section class="hero">
      <div class="hero-row"><div class="mas big" id="homeMas"></div><div><h1>오늘은 어떤 말을 배울까요?</h1><button class="daily" id="daily"></button></div></div>
    </section>
    <section class="goal" id="goal"></section>
    <div id="cont"></div>
    <section class="passport"><h3>내 여권</h3><div class="stamps" id="stamps"></div></section>
    <p class="notice" id="notice"></p>
    <input id="search" class="search" type="search" placeholder="언어 이름으로 찾기 (예: 스와힐리어)" autocomplete="off">
    <div class="chips" role="group" aria-label="보기">
      <button class="chip" id="fReady" aria-pressed="true"></button>
      <button class="chip" id="fAll" aria-pressed="false"></button>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <!-- 코스 -->
  <main id="course" hidden>
    <button class="back" id="toHome">← 언어 고르기</button>
    <div class="course-head">
      <h2 id="cName"></h2>
      <p id="cInfo"></p>
    </div>
    <div class="path" id="path"></div>
    <button class="blitz" id="blitzBtn"></button>
    <section class="words">
      <h3>단어장</h3>
      <div id="wlist"></div>
    </section>
  </main>

  <!-- 레슨 -->
  <main id="lesson" hidden>
    <div class="lhead">
      <button class="x" id="quit" aria-label="레슨 그만하기">✕</button>
      <div class="progress"><i id="prog"></i></div>
      <span class="combo" id="combo" hidden></span>
      <span class="stat time" id="timer" hidden>60초</span>
      <span class="stat heart" id="heartStat" title="하트"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><b id="hearts">5</b></span>
    </div>
    <div id="qbox"></div>
  </main>

  <!-- 결과 -->
  <main id="result" hidden>
    <div class="result" id="rbox"></div>
  </main>
</div>

<footer class="foot" id="foot" hidden>
  <div class="foot-in">
    <div class="fb" id="fb" hidden></div>
    <button class="btn" id="action" disabled>확인</button>
  </div>
</footer>
<div class="toast" id="toast" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>

// 레벨, 오늘 목표
const LV_XP = 50, GOAL = 30;

// 번개 퀴즈: 60초 동안 많이 맞히기
let blitzT = null;
function startBlitz() {

}

// 꽃가루
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#fx"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--gold", "--good", "--bad"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: 150 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .35, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (t - t0 < 2800) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })(t0);
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// 소리
function speak(text, code) {
  try {
    const syn = window.speechSynthesis;
    if (!syn) { toast("이 브라우저는 소리 읽기를 지원하지 않아요."); return; }
    const pre = code.toLowerCase().split("-")[0];
    const voices = syn.getVoices();
    const v = voices.find(v => v.lang.replace("_", "-").toLowerCase() === code.toLowerCase()) || voices.find(v => v.lang.toLowerCase().startsWith(pre));
    if (voices.length && !v) toast("이 기기에는 이 언어 목소리가 없어요. 읽는 법을 보고 따라 해 보세요.");
    const u = new SpeechSynthesisUtterance(text);
    u.lang = code; if (v) u.voice = v; u.rate = .85;
    syn.cancel(); syn.speak(u);
  } catch (e) {}
}
let actx;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = ok ? "sine" : "square";
      g.gain.setValueAtTime(.08, actx.currentTime + i * .1);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + i * .1 + .18);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + i * .1); o.stop(actx.currentTime + i * .1 + .2);
    });
  } catch (e) {}
}

// 레슨
let LS = null;
function startLesson(i) {
  const ws = LESSONS[i].w;
  let qs = [];
  ws.forEach(k => { qs.push({ type: "pick", k }); qs.push({ type: "rev", k }); });
  qs = shuffle(qs);
  if (i === LESSONS.length - 1) qs = qs.slice(0, 10);
  // 짝 맞추기 4쌍: 이번 단원 단어 + 부족하면 다른 단어
  const extra = shuffle(KO.map((_, k) => k).filter(k => !ws.includes(k)));
  const mk = shuffle(ws).slice(0, 4).concat(extra).slice(0, 4);
  qs.splice(Math.min(3, qs.length), 0, { type: "match", keys: mk });
  LS = { mode: "lesson", i, qs, pos: 0, hearts: 5, first: qs.length, right: 0, wrong: 0, combo: 0, bonus: 0, sel: null, state: "ask" };
  show("lesson"); setMode();
  renderQ();
}
function optsFor(k) { return shuffle([k, ...shuffle(KO.map((_, j) => j).filter(j => j !== k)).slice(0, 3)]); }
function renderQ() {
  const q = LS.qs[LS.pos], ws = words(cur), code = L[cur][0];
  if (LS.mode !== "blitz") $("#prog").style.width = (LS.pos / LS.qs.length * 100) + "%";
  $("#hearts").textContent = LS.hearts;
  LS.sel = null; LS.state = "ask";
  const foot = $("#foot"); foot.className = "foot"; $("#fb").hidden = true;
  const act = $("#action"); act.textContent = "확인"; act.disabled = true;
  const box = $("#qbox");
  if (q.type === "pick") {
    q.opts = q.opts || optsFor(q.k);
    box.innerHTML = `<h3 class="qtitle">이 말은 무슨 뜻일까요?</h3>
      <div class="prompt"><button class="spk" id="say" aria-label="듣기">${SPK}</button><div class="word" dir="auto">${esc(ws[q.k].w)}${ws[q.k].r ? `<small>${esc(ws[q.k].r)}</small>` : ""}</div></div>
      <div class="opts">${q.opts.map((o, n) => `<button class="opt" data-o="${o}"><span class="k">${n + 1}</span>${KO[o]}</button>`).join("")}</div>`;
    $("#say").onclick = () => speak(ws[q.k].w, code);

  } else if (q.type === "rev") {
    q.opts = q.opts || optsFor(q.k);
    box.innerHTML = `<h3 class="qtitle">${cur}로 고르세요</h3>
      <div class="prompt"><div class="word">${KO[q.k]}</div></div>
      <div class="opts">${q.opts.map((o, n) => `<button class="opt" data-o="${o}" dir="auto"><span class="k">${n + 1}</span>${esc(ws[o].w)}${ws[o].r ? `<small>${esc(ws[o].r)}</small>` : ""}</button>`).join("")}</div>`;
  } else {

      <div class="match"><div class="col">${left.map(k => `<button class="opt" data-side="l" data-k="${k}">${KO[k]}</button>`).join("")}</div>
      <div class="col">${right.map(k => `<button class="opt" data-side="r" data-k="${k}" dir="auto">${esc(ws[k].w)}${ws[k].r ? `<small>${esc(ws[k].r)}</small>` : ""}</button>`).join("")}</div></div>`;
    act.textContent = "짝을 모두 맞추면 넘어가요";

}

  if (q.type === "rev") speak(words(cur)[LS.sel].w, L[cur][0]);
});
function matchTap(b) {
  const side = b.dataset.side, k = +b.dataset.k, P = LS.pick;
  if (side === "r") speak(words(cur)[k].w, L[cur][0]);
  document.querySelectorAll(`#qbox .opt[data-side="${side}"]`).forEach(x => x.setAttribute("aria-pressed", x === b));
  P[side] = b;
  if (P.l && P.r) {
    const a = P.l, c = P.r;
    if (a.dataset.k === c.dataset.k) {
      [a, c].forEach(x => { x.classList.add("right"); x.setAttribute("aria-pressed", false); setTimeout(() => { x.classList.remove("right"); x.classList.add("gone"); }, 250); });
      P.left--; beep(true);
      if (P.left === 0) { if (!P.miss) { LS.right++; LS.combo++; if (LS.combo >= 3) LS.bonus++; } else LS.combo = 0; feedback(true, ""); }
    } else {
      P.miss = true; beep(false);
      [a, c].forEach(x => { x.classList.add("wrong", "shake"); x.setAttribute("aria-pressed", false); setTimeout(() => x.classList.remove("wrong", "shake"), 400); });
    }
    P.l = P.r = null;
  }
}
function check() {
  const q = LS.qs[LS.pos], ws = words(cur);
  const ok = LS.sel === q.k;
  document.querySelectorAll("#qbox .opt").forEach(x => {
    const o = +x.dataset.o;
    if (o === q.k) x.classList.add("right"); else if (o === LS.sel) x.classList.add("wrong");
  });
  if (ok) { LS.right++; LS.combo++; if (LS.combo >= 3 && LS.mode !== "blitz") LS.bonus++; }
  else if (LS.mode === "blitz") { LS.wrong++; LS.combo = 0; LS.end -= 3000; }
  else {
    LS.wrong++; LS.hearts--; LS.combo = 0;
    $("#hearts").textContent = LS.hearts;
    LS.qs.push({ type: q.type, k: q.k }); // 틀린 문제는 끝에 한 번 더
  }
  beep(ok);
  const ans = q.type === "pick" ? `${ws[q.k].w} = ${KO[q.k]}` : `${KO[q.k]} = ${ws[q.k].w}${ws[q.k].r ? ` (${ws[q.k].r})` : ""}`;
  feedback(ok, ans);
}
const PRAISE = ["잘했어요!", "정답이에요!", "멋져요!", "완벽해요!"];
function feedback(ok, ans) {
  LS.state = "fb";
  const foot = $("#foot"), fb = $("#fb");
  foot.className = "foot " + (ok ? "ok" : "no");
  fb.hidden = false;
  fb.innerHTML = ok ? `${PRAISE[Math.floor(Math.random() * PRAISE.length)]}${ans ? `<small dir="auto">${esc(ans)}</small>` : ""}` : `아쉬워요<small dir="auto">정답: ${esc(ans)}</small>`;
  const act = $("#action"); act.disabled = false; act.textContent = "계속"; act.focus();
  react(ok);
  if (LS.mode === "blitz") { act.disabled = true; act.textContent = ok ? "+1점" : "-3초"; LS.state = "wait"; setTimeout(next, ok ? 450 : 1100); }
}
function next() {
  if (LS.mode === "blitz") return nextBlitz();
  if (LS.hearts <= 0) return finish(false);
  LS.pos++;
  if (LS.pos >= LS.qs.length) return finish(true);
  renderQ();
}
$("#action").onclick = () => { if (LS.mode === "blitz") return; if (LS.state === "ask") { if (LS.sel !== null) check(); } else next(); };
$("#quit").onclick = () => { clearInterval(blitzT); if (LS) LS.state = "over"; openCourse(cur); };
document.addEventListener("keydown", e => {
  if ($("#lesson").hidden || e.target.tagName === "INPUT") return;
  if (e.key === "Enter") { e.preventDefault(); $("#action").click(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4 && LS.state === "ask") { const b = document.querySelectorAll("#qbox .opts .opt")[n - 1]; if (b) b.click(); }
});

function finish(ok) {
  $("#prog").style.width = "100%";
  const r = $("#rbox");
  if (!ok) {
    r.innerHTML = `<div class="mas big">${mascot("sad")}</div><h2>하트를 다 썼어요</h2><p>괜찮아요. 단어장을 한 번 보고 다시 해 봐요.</p>
      <button class="btn" id="retry">다시 하기</button><button class="btn ghost" id="toC">단원 목록으로</button>`;
  } else {
    const total = LS.right + LS.wrong;
    const acc = total ? Math.round(LS.right / total * 100) : 100;
    const gain = 10 + (LS.wrong === 0 ? 5 : 0) + LS.bonus;
    const lvUp = addXP(gain);
    S.done[cur] = Math.max(S.done[cur] || 0, LS.i + 1);
    const today = dayStr(new Date()), yest = dayStr(new Date(Date.now() - 864e5));
    if (S.last !== today) { S.streak = S.last === yest ? S.streak + 1 : 1; S.last = today; }
    const newStamp = S.done[cur] >= LESSONS.length && !S.stamps[cur];
    if (newStamp) S.stamps[cur] = dayStr(new Date());
    save(); stats();
    const all = S.done[cur] >= LESSONS.length;
    r.innerHTML = `<div class="medal">${LS.i + 1}</div><h2>${LESSONS[LS.i].t} 단원 완료!</h2>
      <p>${all ? `${cur} 기초 단어 ${KO.length}개를 모두 배웠어요.` : `다음은 ${LESSONS[Math.min(LS.i + 1, LESSONS.length - 1)].t} 단원이에요.`}</p>
      <div class="tiles"><div class="tile"><b>+${gain}</b><span>경험치</span></div><div class="tile"><b>${acc}%</b><span>정확도</span></div><div class="tile"><b>${S.streak}일</b><span>연속 학습</span></div></div>
      ${lvUp ? `<p class="lvup">레벨 업! 이제 Lv.${level()}</p>` : ""}
      ${newStamp ? `<div class="stamp new">${stampHtml(cur)}</div><p>${esc(cur)} 여권 도장을 받았어요!</p>` : ""}
      <button class="btn" id="toC">계속하기</button>`;
  }
  show("result");
  if (ok) confetti();
  const toC = $("#toC"); if (toC) toC.onclick = () => openCourse(cur);
  const re = $("#retry"); if (re) re.onclick = () => startLesson(LS.i);
}

try { speechSynthesis.getVoices(); } catch (e) {}
renderHome();
show("home");
</script>
</body>
</html>
